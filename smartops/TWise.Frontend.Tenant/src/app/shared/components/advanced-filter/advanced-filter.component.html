<!-- Advanced Filter offcanvas -->
<div class="advanced-filter-backdrop" *ngIf="showPanel" (click)="close()"></div>
<div class="advanced-filter-panel" [class.advanced-filter-panel--open]="showPanel">
  <div class="advanced-filter-panel__header">
    <span class="advanced-filter-panel__header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M5 10H15M2.5 5H17.5M7.5 15H12.5" stroke="#21409A" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </span>
    <h3 class="advanced-filter-panel__title">Advanced Filter</h3>
    <button class="advanced-filter-panel__close" aria-label="Close advanced filter" (click)="close()">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path
          d="M13.8 7.8L7.8 13.8M7.8 7.8L13.8 13.8M20.8 10.8C20.8 16.3 16.3 20.8 10.8 20.8C5.3 20.8 0.8 16.3 0.8 10.8C0.8 5.3 5.3 0.8 10.8 0.8C16.3 0.8 20.8 5.3 20.8 10.8Z"
          stroke="#4D555B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

    <!-- Hierarchy -->
    <div class="filter-section">
      <div class="filter-section__header-row">
        <button type="button" class="filter-section__header" [attr.aria-expanded]="hierarchyExpanded" (click)="toggleHierarchySection()">
          <span class="filter-section__icon filter-section__icon--purple">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path
                d="M2.33203 9.91667V9.8C2.33203 8.81988 2.33203 8.32988 2.52278 7.9555C2.69055 7.62621 2.95824 7.35852 3.28753 7.19075C3.66191 7 4.15191 7 5.13203 7H8.86536C9.84546 7 10.3355 7 10.7098 7.19075C11.0391 7.35852 11.3068 7.62621 11.4746 7.9555C11.6654 8.32988 11.6654 8.81988 11.6654 9.8V9.91667M2.33203 9.91667C1.68768 9.91667 1.16536 10.439 1.16536 11.0833C1.16536 11.7277 1.68768 12.25 2.33203 12.25C2.97638 12.25 3.4987 11.7277 3.4987 11.0833C3.4987 10.439 2.97638 9.91667 2.33203 9.91667ZM11.6654 9.91667C11.021 9.91667 10.4987 10.439 10.4987 11.0833C10.4987 11.7277 11.021 12.25 11.6654 12.25C12.3097 12.25 12.832 11.7277 12.832 11.0833C12.832 10.439 12.3097 9.91667 11.6654 9.91667ZM6.9987 4.08333V9.91667M6.9987 4.08333C6.35435 4.08333 5.83203 3.561 5.83203 2.91667C5.83203 2.27233 6.35435 1.75 6.9987 1.75C7.64305 1.75 8.16536 2.27233 8.16536 2.91667C8.16536 3.561 7.64305 4.08333 6.9987 4.08333ZM6.9987 9.91667C6.35435 9.91667 5.83203 10.439 5.83203 11.0833C5.83203 11.7277 6.35435 12.25 6.9987 12.25C7.64305 12.25 8.16536 11.7277 8.16536 11.0833C8.16536 10.439 7.64305 9.91667 6.9987 9.91667Z"
                stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="filter-section__label">Hierarchy</span>
          <span class="filter-section__badge" *ngIf="hierarchyActiveCount">{{ hierarchyActiveCount }} Active</span>
          <svg class="filter-section__chevron" [class.filter-section__chevron--collapsed]="!hierarchyExpanded"
            xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M11.25 9.375L7.5 5.625L3.75 9.375" stroke="#667085" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
  
        </button>
        <!-- Its own button, not inside the header button: nested controls are unusable for screen readers. -->
        <button type="button" class="filter-section__clear" (click)="clearHierarchyFilters()">Clear All</button>
      </div>

      <div class="filter-section__body" *ngIf="hierarchyExpanded">
        <div class="filter-field" *ngFor="let field of hierarchyFields" [hidden]="field.hidden">
          <label class="filter-field__label">{{ field.label }}</label>

          <div class="filter-multiselect" (click)="$event.stopPropagation()">
            <div class="filter-multiselect__chips">
              <span class="filter-chip" *ngIf="isAllHierarchySelected(field)">
                All
                <button type="button" class="filter-chip__remove" [attr.aria-label]="'Remove all ' + field.label" (click)="clearHierarchyField(field)">
                  <span aria-hidden="true">&times;</span>
                </button>
              </span>
              <ng-container *ngIf="!isAllHierarchySelected(field)">
              <span class="filter-chip" *ngFor="let value of field.selected">
                {{ hierarchyOptionLabel(field, value) }}
                <button type="button" class="filter-chip__remove" [attr.aria-label]="'Remove ' + value" (click)="removeHierarchyChip(field, value)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15" fill="none">
                    <path d="M11.25 3.75L3.75 11.25M3.75 3.75L11.25 11.25" stroke="#667085" stroke-width="1.6"
                      stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </span>
              </ng-container>
              <span class="filter-multiselect__placeholder" *ngIf="!field.selected.length">None selected</span>
            </div>

            <div class="filter-multiselect__controls">
              <button class="filter-multiselect__clear" *ngIf="field.selected.length > 1"
                [attr.aria-label]="'Clear ' + field.label" (click)="clearHierarchyField(field)">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15" fill="none">
                  <path d="M11.25 3.75L3.75 11.25M3.75 3.75L11.25 11.25" stroke="#667085" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <button class="filter-multiselect__toggle" [attr.aria-label]="'Toggle ' + field.label + ' options'" [attr.aria-expanded]="field.dropdownOpen" (click)="toggleHierarchyFieldDropdown(field)">
                <svg class="filter-multiselect__toggle-icon"
                  [class.filter-multiselect__toggle-icon--open]="field.dropdownOpen" xmlns="http://www.w3.org/2000/svg"
                  width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M4.5 6.75L9 11.25L13.5 6.75" stroke="#667085" stroke-width="1.4" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </button>
            </div>

            <div class="filter-multiselect__dropdown" *ngIf="field.dropdownOpen">
              <button *ngIf="field.id === 'resource-type'" type="button" class="filter-multiselect__option" [disabled]="!field.options.length"
                (click)="selectAllHierarchyOptions(field)">All</button>
              <button class="filter-multiselect__option" *ngFor="let option of availableHierarchyOptions(field)"
                (click)="selectHierarchyOption(field, option)">
                {{ option.label }}
              </button>
              <p class="filter-multiselect__empty" *ngIf="!availableHierarchyOptions(field).length">No more options</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="advanced-filter-panel__footer">
    <button class="advanced-filter-panel__reset-btn" (click)="reset()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path
          d="M1.5 7.5C1.5 7.5 3.00374 5.45116 4.22538 4.22868C5.44702 3.0062 7.1352 2.25 9 2.25C12.728 2.25 15.75 5.27208 15.75 9C15.75 12.728 12.728 15.75 9 15.75C5.92268 15.75 3.32633 13.6907 2.51383 10.875M6 7.5H1.5V3"
          stroke="#4D555B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Reset
    </button>
    <button class="advanced-filter-panel__apply-btn" (click)="apply()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M15 4.5L6.75 12.75L3 9" stroke="white" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      Apply
    </button>
  </div>
</div>
