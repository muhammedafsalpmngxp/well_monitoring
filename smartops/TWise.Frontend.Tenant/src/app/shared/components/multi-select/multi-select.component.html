<div class="multi-select">
  <label class="multi-select__label" *ngIf="label">
    {{ label }}<span class="multi-select__required" *ngIf="required"> *</span>
  </label>

  <div class="multi-select__chips" *ngIf="selectedOptions.length">
    <span class="multi-select__chip" [class.multi-select__chip--blue]="opt.accent === 'blue'" [class.multi-select__chip--teal]="opt.accent === 'teal'" [class.multi-select__chip--green]="opt.accent === 'green'" [class.multi-select__chip--purple]="opt.accent === 'purple'" *ngFor="let opt of selectedOptions">
      {{ opt.label }}
      <button type="button" class="multi-select__chip-remove" (click)="removeChip(opt.id)" [attr.aria-label]="'Remove ' + opt.label">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </span>
  </div>

  <div class="multi-select__panel" [class.multi-select__panel--invalid]="invalid">
    <div class="multi-select__search">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.7 12.7002L9.80001 9.8002M11.3667 6.03353C11.3667 8.97906 8.97888 11.3669 6.03335 11.3669C3.08783 11.3669 0.700012 8.97906 0.700012 6.03353C0.700012 3.08801 3.08783 0.700195 6.03335 0.700195C8.97888 0.700195 11.3667 3.08801 11.3667 6.03353Z" stroke="#667085" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <input type="text" [placeholder]="placeholder" [(ngModel)]="searchTerm" />
    </div>
    <ul class="multi-select__list">
      <li *ngFor="let opt of filteredOptions">
        <!-- The label makes the option text toggle its checkbox and names it for screen readers. -->
        <label class="multi-select__option">
          <input type="checkbox" [checked]="isSelected(opt.id)" (change)="toggleOption(opt.id)" />
          <span>{{ opt.label }}</span>
        </label>
      </li>
      <li *ngIf="!filteredOptions.length" class="multi-select__empty">No matches found</li>
    </ul>
    <div class="multi-select__footer">
      <span>{{ selectedIds.length }} Selected</span>
      <button type="button" (click)="clearAll()" [disabled]="!selectedIds.length">Clear All</button>
    </div>
  </div>
</div>
