<div class="app-date-input" [class.app-date-input--disabled]="disabled">
  <span class="app-date-input__display" [class.app-date-input__display--placeholder]="!value">{{ displayText }}</span>
  <input
    #native
    type="date"
    class="app-date-input__native"
    [attr.aria-label]="ariaLabel"
    [value]="value"
    [min]="min"
    [max]="max"
    [disabled]="disabled"
    (change)="onNativeChange(native.value)"
  />
  <svg class="app-date-input__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
    <line x1="16" y1="2" x2="16" y2="6"></line>
    <line x1="8" y1="2" x2="8" y2="6"></line>
    <line x1="3" y1="10" x2="21" y2="10"></line>
  </svg>
</div>
