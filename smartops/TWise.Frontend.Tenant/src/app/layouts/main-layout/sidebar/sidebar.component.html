<div class="sidebar-backdrop" *ngIf="isMobileOpen" (click)="closeMobile.emit()"></div>

<aside
  class="sidebar"
  [class.sidebar--collapsed]="isCollapsed"
  [class.sidebar--mobile-open]="isMobileOpen"
>
  <!-- Section 1: logo, white background -->
  <div class="logoOuterDivMain">
    <div class="sidebar__brand" [class.sidebar__brand--collapsed]="isCollapsed">
      <img
        [src]="
          isCollapsed ? 'assets/images/hide%20sidepannel-logo.svg' : 'assets/images/second-logo.png'
        "
        alt="Al Tasnim T-Wise"
        class="sidebar__logo"
      />
    </div>
  </div>

  <!-- Section 2: search + nav menu, dark navy background with dot/glow pattern -->
  <div class="sidebar__nav-section">
    <div class="sidebar__toolbar" [class.sidebar__toolbar--collapsed]="isCollapsed">
      <div *ngIf="!isCollapsed" class="sidebar__search">
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M15.75 15.75L12.4875 12.4875M14.25 8.25C14.25 11.5637 11.5637 14.25 8.25 14.25C4.93629 14.25 2.25 11.5637 2.25 8.25C2.25 4.93629 4.93629 2.25 8.25 2.25C11.5637 2.25 14.25 4.93629 14.25 8.25Z"
            stroke="#667085"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <input
          type="text"
          class="sidebar__search-input"
          placeholder="Search"
          aria-label="Search menu"
          [(ngModel)]="searchTerm"
        />
      </div>
    </div>

    <nav class="sidebar__nav">
      <ng-container *ngFor="let group of filteredGroups">
        <ul class="sidebar__menu">
          <li *ngFor="let item of group.items" class="sidebar__menu-item">
            <!-- Leaf item (no children) -->
            <a
              *ngIf="!hasChildren(item)"
              [routerLink]="item.route"
              routerLinkActive="active"
              class="sidebar__menu-link"
              [attr.aria-label]="item.label"
              (click)="closeMobile.emit()"
            >
              <span class="sidebar__icon-chip" [ngClass]="'sidebar__icon-chip--' + item.icon">
                <app-icon [name]="item.icon" class="sidebar__icon"></app-icon>
              </span>
              <ng-container *ngIf="!isCollapsed">
                <span class="sidebar__label">{{ item.label }}</span>
                <span *ngIf="item.badge" class="badge sidebar__badge">{{ item.badge }}</span>
              </ng-container>
            </a>

            <!-- Parent item (has children) -->
            <ng-container *ngIf="hasChildren(item)">
              <button
                class="sidebar__menu-link sidebar__menu-link--parent"
                [attr.aria-label]="item.label"
                [attr.aria-expanded]="isExpanded(item.label)"
                [class.expanded]="isExpanded(item.label)"
                [class.active]="isParentActive(item)"
                [attr.data-tour]="tourIdFor(item.label)"
                (click)="toggleItem(item, $event)"
              >
                <span class="sidebar__icon-chip" [ngClass]="'sidebar__icon-chip--' + item.icon">
                  <app-icon [name]="item.icon" class="sidebar__icon"></app-icon>
                </span>
                <ng-container *ngIf="!isCollapsed">
                  <span class="sidebar__label">{{ item.label }}</span>
                  <span *ngIf="item.badge" class="badge sidebar__badge">{{ item.badge }}</span>
                  <svg
                    class="sidebar__arrow"
                    [class.sidebar__arrow--expanded]="isExpanded(item.label)"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="9 6 15 12 9 18"></polyline>
                  </svg>
                </ng-container>
              </button>

              <div
                *ngIf="!isCollapsed"
                class="sidebar__submenu-wrap"
                [class.sidebar__submenu-wrap--expanded]="isExpanded(item.label)"
              >
                <ul
                  class="sidebar__submenu"
                  [class.has-connector]="item.children && item.children.length > 0"
                >
                  <ng-container *ngFor="let child of item.children">
                  <li *ngIf="!child.hidden" class="sidebar__submenu-item">
                    <a
                      [routerLink]="child.route"
                      [class.active]="isChildActive(child.route)"
                      class="sidebar__submenu-link"
                      (click)="closeMobile.emit()"
                    >
                      <app-icon [name]="child.icon" class="sidebar__submenu-icon"></app-icon>
                      <span class="sidebar__submenu-label">{{ child.label }}</span>
                    </a>
                    <span class="sidebar__submenu-dot"></span>
                  </li>
                  </ng-container>
                </ul>
              </div>

              <!-- Collapsed sidebar: the submenu has no room to expand inline, so it
                   floats as a panel next to the icon instead. -->
              <div *ngIf="isCollapsed && isExpanded(item.label)" class="sidebar__flyout" [style.top.px]="flyoutTop"
                [style.--flyout-arrow-top.px]="flyoutArrowTop">
                <div class="sidebar__flyout-header">
                  <span class="sidebar__icon-chip" [ngClass]="'sidebar__icon-chip--' + item.icon">
                    <app-icon [name]="item.icon" class="sidebar__icon"></app-icon>
                  </span>
                  <span class="sidebar__flyout-title">{{ item.label }}</span>
                  <span *ngIf="item.badge" class="badge sidebar__badge">{{ item.badge }}</span>
                </div>
                <ul
                  class="sidebar__submenu"
                  [class.has-connector]="item.children && item.children.length > 0"
                >
                  <ng-container *ngFor="let child of item.children">
                  <li *ngIf="!child.hidden" class="sidebar__submenu-item">
                    <a
                      [routerLink]="child.route"
                      [class.active]="isChildActive(child.route)"
                      class="sidebar__submenu-link"
                      (click)="closeMobile.emit(); closeFlyout()"
                    >
                      <app-icon [name]="child.icon" class="sidebar__submenu-icon"></app-icon>
                      <span class="sidebar__submenu-label">{{ child.label }}</span>
                    </a>
                    <span class="sidebar__submenu-dot"></span>
                  </li>
                  </ng-container>
                </ul>
              </div>
            </ng-container>
          </li>
        </ul>
      </ng-container>

      <!-- Search returned nothing -->
      <div *ngIf="!isCollapsed && searchTerm.trim() && !filteredGroups.length" class="sidebar__empty" aria-live="polite">
        <svg class="sidebar__empty-art" width="64" height="48" viewBox="0 0 64 48" fill="none" aria-hidden="true">
          <rect x="2" y="8" width="38" height="12" rx="4" fill="#2F6BFF" />
          <rect x="2" y="24" width="38" height="12" rx="4" fill="#2F6BFF" opacity="0.75" />
          <circle cx="9" cy="14" r="2" fill="#fff" />
          <circle cx="9" cy="30" r="2" fill="#fff" />
          <rect x="14" y="13" width="16" height="2" rx="1" fill="#fff" opacity="0.8" />
          <rect x="14" y="29" width="12" height="2" rx="1" fill="#fff" opacity="0.8" />
          <circle cx="40" cy="26" r="11" fill="#DCE7FF" fill-opacity="0.35" stroke="#F58220" stroke-width="3.5" />
          <path d="M48 34l9 9" stroke="#F58220" stroke-width="5" stroke-linecap="round" />
          <path d="M52 4l-2 5M58 8l-5 3M56 15l-4-1" stroke="#F58220" stroke-width="2" stroke-linecap="round" />
        </svg>
        <p class="sidebar__empty-title">No matching menus</p>
        <p class="sidebar__empty-text">Try a different keyword.</p>
        <button type="button" class="sidebar__empty-clear" (click)="searchTerm = ''">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
          Clear search
        </button>
      </div>
    </nav>
  </div>

  <!-- Section 3: Product Tour card — only shown when sidebar is expanded -->
  <div class="productTourBgSecMain">
    <div class="sidebar__promo-section" [class.sidebar__promo-section--collapsed]="isCollapsed">
      <a
        href="#"
        class="sidebar__promo"
        *ngIf="!isCollapsed"
        (click)="$event.preventDefault(); acknowledgePromo()"
      >
        <span class="sidebar__promo-icon">
          <img alt="" src="assets/icons/tour-gif.gif" />
        </span>
        <span class="sidebar__promo-body">
          <span class="sidebar__promo-title">Product Tour</span>
          <span class="sidebar__promo-text">Tasnim Maps</span>
        </span>
        <svg
          class="sidebar__promo-arrow"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
      </a>
      <a
        href="#"
        class="sidebar__promo sidebar__promo--collapsed"
        *ngIf="isCollapsed"
        title="Product Tour"
        (click)="$event.preventDefault(); acknowledgePromo()"
      >
        <span class="sidebar__promo-icon">
          <img alt="" src="assets/icons/tour-gif.gif" />
        </span>
      </a>
    </div>
  </div>
</aside>
