<app-page-header title="Alert Rule Configuration"
  [breadcrumbs]="[{label:'Home'}, {label:'Smart Alerts'}, {label:'Alert Rule Configuration'}]">
  <div class="arc-header-actions">
    <button class="icon-only-btn" title="Export">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path
          d="M5.83333 9.16667C5.05836 9.16667 4.67087 9.16667 4.35295 9.25183C3.49022 9.483 2.81635 10.1569 2.58518 11.0196C2.5 11.3375 2.5 11.725 2.5 12.5V13.5C2.5 14.9002 2.5 15.6002 2.77248 16.135C3.01217 16.6054 3.39462 16.9878 3.86503 17.2275C4.3998 17.5 5.09987 17.5 6.5 17.5H13.5C14.9002 17.5 15.6002 17.5 16.135 17.2275C16.6054 16.9878 16.9878 16.6054 17.2275 16.135C17.5 15.6002 17.5 14.9002 17.5 13.5V12.5C17.5 11.725 17.5 11.3375 17.4148 11.0196C17.1837 10.1569 16.5098 9.483 15.6471 9.25183C15.3292 9.16667 14.9417 9.16667 14.1667 9.16667M6.66667 5.83333L10 2.5L13.3333 5.83333M10 2.5V12.5"
          stroke="#4D555B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button class="icon-only-btn" title="Expand" (click)="toggleExpand()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M11.6667 8.33333L17.5 2.5M17.5 7.5V2.5H12.5M8.33333 11.6667L2.5 17.5M2.5 12.5V17.5H7.5"
          stroke="#4D555B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <app-button variant="primary" (clicked)="createNewRule()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 3.75V14.25M3.75 9H14.25" stroke="white" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      Create new rule
    </app-button>
  </div>
</app-page-header>

<div class="page-content arc-page" [class.arc-page--expanded]="isExpanded">

  <!-- Severity stat tiles -->
  <div class="arc-stats">
    <div class="arc-stat" *ngFor="let s of statTiles">
      <span class="arc-stat__icon arc-stat__icon--{{ s.severity.toLowerCase() }}">
        <svg *ngIf="s.severity === 'Critical'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none">
          <path
            d="M15 9L9 15M9 9L15 15M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z"
            stroke="#EF5350" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="s.severity === 'High'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none">
          <path
            d="M12 8V12M12 16H12.01M2 8.52274V15.4773C2 15.7218 2 15.8441 2.02763 15.9592C2.05213 16.0613 2.09253 16.1588 2.14736 16.2483C2.2092 16.3492 2.29568 16.4357 2.46863 16.6086L7.39137 21.5314C7.56432 21.7043 7.6508 21.7908 7.75172 21.8526C7.84119 21.9075 7.93873 21.9479 8.04077 21.9724C8.15586 22 8.27815 22 8.52274 22H15.4773C15.7218 22 15.8441 22 15.9592 21.9724C16.0613 21.9479 16.1588 21.9075 16.2483 21.8526C16.3492 21.7908 16.4357 21.7043 16.6086 21.5314L21.5314 16.6086C21.7043 16.4357 21.7908 16.3492 21.8526 16.2483C21.9075 16.1588 21.9479 16.0613 21.9724 15.9592C22 15.8441 22 15.7218 22 15.4773V8.52274C22 8.27815 22 8.15586 21.9724 8.04077C21.9479 7.93873 21.9075 7.84119 21.8526 7.75172C21.7908 7.6508 21.7043 7.56432 21.5314 7.39137L16.6086 2.46863C16.4357 2.29568 16.3492 2.2092 16.2483 2.14736C16.1588 2.09253 16.0613 2.05213 15.9592 2.02763C15.8441 2 15.7218 2 15.4773 2H8.52274C8.27815 2 8.15586 2 8.04077 2.02763C7.93873 2.05213 7.84119 2.09253 7.75172 2.14736C7.6508 2.2092 7.56432 2.29568 7.39137 2.46863L2.46863 7.39137C2.29568 7.56432 2.2092 7.6508 2.14736 7.75172C2.09253 7.84119 2.05213 7.93873 2.02763 8.04077C2 8.15586 2 8.27815 2 8.52274Z"
            stroke="#FFA726" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="s.severity === 'Medium'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none">
          <path
            d="M11.9998 8.99999V13M11.9998 17H12.0098M10.6151 3.89171L2.39019 18.0983C1.93398 18.8863 1.70588 19.2803 1.73959 19.6037C1.769 19.8857 1.91677 20.142 2.14613 20.3088C2.40908 20.5 2.86435 20.5 3.77487 20.5H20.2246C21.1352 20.5 21.5904 20.5 21.8534 20.3088C22.0827 20.142 22.2305 19.8857 22.2599 19.6037C22.2936 19.2803 22.0655 18.8863 21.6093 18.0983L13.3844 3.89171C12.9299 3.10654 12.7026 2.71396 12.4061 2.58211C12.1474 2.4671 11.8521 2.4671 11.5935 2.58211C11.2969 2.71396 11.0696 3.10655 10.6151 3.89171Z"
            stroke="#FFCA28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="s.severity === 'Low'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none">
          <path
            d="M12 8V12M12 16H12.01M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z"
            stroke="#66BB6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="s.severity === 'Info'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none">
          <path
            d="M12 8V12M12 16H12.01M7.8 21H16.2C17.8802 21 18.7202 21 19.362 20.673C19.9265 20.3854 20.3854 19.9265 20.673 19.362C21 18.7202 21 17.8802 21 16.2V7.8C21 6.11984 21 5.27976 20.673 4.63803C20.3854 4.07354 19.9265 3.6146 19.362 3.32698C18.7202 3 17.8802 3 16.2 3H7.8C6.11984 3 5.27976 3 4.63803 3.32698C4.07354 3.6146 3.6146 4.07354 3.32698 4.63803C3 5.27976 3 6.11984 3 7.8V16.2C3 17.8802 3 18.7202 3.32698 19.362C3.6146 19.9265 4.07354 20.3854 4.63803 20.673C5.27976 21 6.11984 21 7.8 21Z"
            stroke="#42A5F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

      </span>
      <div class="arc-stat__text">
        <span class="arc-stat__label">{{ s.severity }}</span>
        <span class="arc-stat__value">{{ s.value }}</span>
      </div>
    </div>
  </div>

  <!-- Search + severity filter -->

    <div class="arc-filterbar">
      <div class="arc-filterbar__field">
        <label>Search</label>
        <div class="arc-search">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12.7 12.7002L9.80001 9.8002M11.3667 6.03353C11.3667 8.97906 8.97888 11.3669 6.03335 11.3669C3.08783 11.3669 0.700012 8.97906 0.700012 6.03353C0.700012 3.08801 3.08783 0.700195 6.03335 0.700195C8.97888 0.700195 11.3667 3.08801 11.3667 6.03353Z"
              stroke="#667085" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input type="text" placeholder="Search" [(ngModel)]="searchTerm" (ngModelChange)="currentPage = 1"
            aria-label="Search alert rules" />
        </div>
      </div>

      <div class="arc-filterbar__field">
        <label>Severity</label>
        <div class="arc-severity">
          <button class="arc-chip" [class.active]="selectedSeverity === 'All'" (click)="setSeverity('All')">All</button>
          <button class="arc-chip" *ngFor="let sev of severityOptions" [class.active]="selectedSeverity === sev"
            (click)="setSeverity(sev)">{{ sev }}</button>
        </div>
      </div>
    </div>

  <!-- Rules table — AG Grid (data-dictionary style) -->
  <div class="arc-grid-wrapper">
    <ag-grid-angular
      class="arc-grid"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowData]="filteredRules"
      [theme]="gridTheme"
      [rowSelection]="rowSelection"
      [selectionColumnDef]="selectionColumnDef"
      [context]="gridContext"
      [animateRows]="true"
      suppressNoRowsOverlay="true">
    </ag-grid-angular>

    <!-- Pagination inside the bordered wrapper -->
    <div class="arc-pagination">
      <span class="arc-pagination__range">{{ rangeStart }} to {{ rangeEnd }} of {{ totalCount | number }}</span>
      <div class="arc-pagination__controls">
        <button (click)="goToFirstPage()" [disabled]="currentPage===1" title="First"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg></button>
        <button (click)="goToPrevPage()"  [disabled]="currentPage===1" title="Prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <span class="arc-pagination__page">Page {{ currentPage }} of {{ totalPages }}</span>
        <button (click)="goToNextPage()" [disabled]="currentPage===totalPages" title="Next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        <button (click)="goToLastPage()"  [disabled]="currentPage===totalPages" title="Last"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg></button>
      </div>
    </div>
  </div>
</div>
