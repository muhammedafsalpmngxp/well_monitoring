<app-page-header title="Activity Log" [breadcrumbs]="[{label:'Agentic AI'},{label:'Activity Log'}]">
  <div class="acl-header-actions">
    <button class="acl-filter-toggle-btn" [class.acl-filter-toggle-btn--active]="showFilterPanel"
      (click)="toggleFilterPanel()">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M2.53404 4.25015C1.96679 3.61616 1.68316 3.29917 1.67247 3.02976C1.66317 2.79573 1.76374 2.57079 1.94435 2.42167C2.15226 2.25 2.57762 2.25 3.42834 2.25H14.5605C15.4113 2.25 15.8367 2.25 16.0446 2.42167C16.2252 2.57079 16.3257 2.79573 16.3164 3.02976C16.3057 3.29917 16.0221 3.61616 15.4548 4.25015L11.1752 9.0333C11.0621 9.15967 11.0055 9.2229 10.9653 9.29482C10.9295 9.35857 10.9032 9.42727 10.8873 9.4986C10.8694 9.57907 10.8694 9.6639 10.8694 9.83347V13.8438C10.8694 13.9904 10.8694 14.0638 10.8458 14.1272C10.8249 14.1832 10.7909 14.2334 10.7466 14.2736C10.6965 14.3191 10.6284 14.3464 10.4923 14.4009L7.9423 15.4209C7.6666 15.5311 7.52875 15.5863 7.41814 15.5632C7.32138 15.5431 7.23648 15.4857 7.18188 15.4033C7.11944 15.3091 7.11944 15.1606 7.11944 14.8638V9.83347C7.11944 9.6639 7.11944 9.57907 7.10153 9.4986C7.08564 9.42727 7.05941 9.35857 7.02366 9.29482C6.98334 9.2229 6.9268 9.15967 6.81372 9.0333L2.53404 4.25015Z"
          stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Filter
      <svg [style.transform]="showFilterPanel ? 'rotate(180deg)' : 'none'" style="transition:transform 0.15s ease"
        width="14" height="14" viewBox="0 0 14 8" fill="none">
        <path d="M1 1L7 7L13 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</app-page-header>

<div class="page-content acl-page">

  <!-- Filter Panel -->
  <div class="acl-filter-panel" *ngIf="showFilterPanel || filterPinned">

    <!-- Pin button -->
    <button class="acl-filter-panel__pin" [class.acl-filter-panel__pin--active]="filterPinned" (click)="togglePin()"
      [title]="filterPinned ? 'Unpin filter panel' : 'Pin filter panel'">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M6.00032 8.0001H1.33366M11.1282 5.33345H9.70782C9.56914 5.33345 9.4998 5.33345 9.43348 5.31984C9.37464 5.30777 9.31772 5.28779 9.26419 5.26047C9.20392 5.22966 9.14979 5.18635 9.04146 5.09971L7.73332 4.05319C7.17852 3.60937 6.90119 3.38745 6.66772 3.38721C6.46466 3.38699 6.27259 3.47929 6.14599 3.63797C6.00032 3.82042 6.00032 4.17565 6.00032 4.88612V11.1141C6.00032 11.8246 6.00032 12.1798 6.14599 12.3623C6.27259 12.521 6.46466 12.6132 6.66772 12.613C6.90119 12.6128 7.17852 12.3909 7.73332 11.947L9.04146 10.9005C9.14979 10.8139 9.20392 10.7706 9.26419 10.7398C9.31772 10.7124 9.37464 10.6925 9.43348 10.6804C9.4998 10.6668 9.56914 10.6668 9.70782 10.6668H11.1282C11.205 10.6668 11.2434 10.6668 11.2812 10.6711C11.3148 10.675 11.3481 10.6814 11.3807 10.6903C11.4175 10.7003 11.4531 10.7146 11.5244 10.7431L13.2042 11.415C13.6942 11.611 13.9393 11.709 14.136 11.6682C14.308 11.6324 14.4589 11.5302 14.556 11.3838C14.667 11.2163 14.667 10.9524 14.667 10.4246V5.57562C14.667 5.04781 14.667 4.78391 14.556 4.61646C14.4589 4.47003 14.308 4.36783 14.136 4.33209C13.9393 4.29121 13.6942 4.38922 13.2042 4.58525L11.5244 5.25716C11.4531 5.28567 11.4175 5.29992 11.3807 5.30995C11.3481 5.31885 11.3148 5.32526 11.2812 5.32911C11.2434 5.33345 11.205 5.33345 11.1282 5.33345Z"
          stroke="#4D555B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <!-- Row 1: Geo filters -->
    <div class="acl-filter-panel__row">
      <div class="acl-filter-field">
        <label>Country</label>
        <select [(ngModel)]="filterCountry">
          <option *ngFor="let o of filterCountryOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
      <div class="acl-filter-field">
        <label>Sector</label>
        <select [(ngModel)]="filterSector">
          <option *ngFor="let o of filterSectorOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
      <div class="acl-filter-field">
        <label>Business Unit</label>
        <select [(ngModel)]="filterBusinessUnit">
          <option value="" disabled hidden>Select</option>
          <option *ngFor="let o of filterBusinessUnitOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
      <div class="acl-filter-field">
        <label>Division</label>
        <select [(ngModel)]="filterDivision">
          <option value="" disabled hidden>Select</option>
          <option *ngFor="let o of filterDivisionOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
      <div class="acl-filter-field">
        <label>Cluster</label>
        <select [(ngModel)]="filterCluster">
          <option value="" disabled hidden>Select</option>
          <option *ngFor="let o of filterClusterOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
      <div class="acl-filter-field">
        <label>Plant</label>
        <select [(ngModel)]="filterPlant">
          <option value="" disabled hidden>Select</option>
          <option *ngFor="let o of filterPlantOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
    </div>

    <!-- Row 2: Date range + actions -->
    <div class="acl-filter-panel__row acl-filter-panel__row--actions">
      <div class="acl-filter-field">
        <label>Quick Range</label>
        <select [ngModel]="filterQuickRange" (ngModelChange)="onQuickRangeChange($event)">
          <option value="" disabled hidden>Select</option>
          <option *ngFor="let o of filterQuickRangeOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
      <div class="acl-filter-field">
        <label>From</label>
        <div class="acl-filter-date">
          <input type="text" [(ngModel)]="filterFrom" placeholder="mm-dd-yyyy" />
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
      </div>
      <div class="acl-filter-field">
        <label>To</label>
        <div class="acl-filter-date">
          <input type="text" [(ngModel)]="filterTo" placeholder="mm-dd-yyyy" [disabled]="filterQuickRange === 'After'" />
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
      </div>

      <div class="acl-filter-panel__btn-group">
        <button class="acl-filter-icon-btn" title="Saved filters">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#acl-clip0)">
              <path
                d="M12.75 0.5C15.3689 0.5 17.5 2.63114 17.5 5.25C17.5 7.86886 15.3689 10 12.75 10C10.1311 10 8 7.86886 8 5.25C8 2.63114 10.1311 0.5 12.75 0.5ZM12.75 1C10.4061 1 8.5 2.90611 8.5 5.25C8.5 7.59389 10.4061 9.5 12.75 9.5C15.0939 9.5 17 7.59389 17 5.25C17 2.90611 15.0939 1 12.75 1ZM14.0732 3.57324C14.1712 3.47525 14.3288 3.47525 14.4268 3.57324C14.5247 3.67123 14.5247 3.82877 14.4268 3.92676L13.1035 5.25L14.4268 6.57324C14.5247 6.67123 14.5247 6.82877 14.4268 6.92676C14.3778 6.97569 14.3145 7 14.25 7C14.1855 7 14.1222 6.97569 14.0732 6.92676L12.75 5.60352L11.4268 6.92676C11.3778 6.97569 11.3145 7 11.25 7C11.1855 7 11.1222 6.97569 11.0732 6.92676C10.9753 6.82877 10.9753 6.67123 11.0732 6.57324L12.3965 5.25L11.0732 3.92676C10.9753 3.82877 10.9753 3.67123 11.0732 3.57324C11.1712 3.47525 11.3288 3.47525 11.4268 3.57324L12.75 4.89648L14.0732 3.57324ZM6.5 10.5947L6.37402 10.4531L1.1123 4.53418C0.717423 4.08955 0.50008 3.51837 0.5 2.92383C0.5 1.58822 1.58822 0.5 2.92383 0.5H6.75C6.88786 0.5 7 0.612142 7 0.75C7 0.887858 6.88786 1 6.75 1H2.92383C1.86319 1 1 1.86319 1 2.92383C1.00007 3.33655 1.13214 3.7358 1.375 4.06543L1.48535 4.20215L6.93652 10.334V10.335C6.97623 10.3796 6.99902 10.4377 6.99902 10.501V14.876L7.19922 15.0254L8.69922 16.1504L9.49902 16.751V12.001C9.49902 11.8632 9.61127 11.7511 9.74902 11.751C9.88688 11.751 9.99902 11.8631 9.99902 12.001V13.207L10 13.2061V17.25C10 17.3444 9.94664 17.4306 9.86133 17.4736C9.82681 17.4909 9.78922 17.5 9.75 17.5C9.72387 17.5 9.69747 17.4958 9.67188 17.4873L9.59863 17.4492L6.59961 15.2002L6.59863 15.1992C6.53725 15.1533 6.5 15.0795 6.5 15V10.5947Z"
                fill="#21409A" stroke="#21409A" />
            </g>
            <defs>
              <clipPath id="acl-clip0">
                <rect width="18" height="18" fill="white" />
              </clipPath>
            </defs>
          </svg>
        </button>
        <button class="acl-filter-icon-btn" title="Adjustments">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2.5 4.16667H7.5M7.5 4.16667C7.5 5.08714 8.24617 5.83333 9.16667 5.83333C10.0872 5.83333 10.8333 5.08714 10.8333 4.16667C10.8333 3.24619 10.0872 2.5 9.16667 2.5C8.24617 2.5 7.5 3.24619 7.5 4.16667ZM14.1667 4.16667H17.5M2.5 10H7.5M14.1667 10H17.5M14.1667 10C14.1667 9.0795 13.4205 8.33333 12.5 8.33333C11.5795 8.33333 10.8333 9.0795 10.8333 10C10.8333 10.9205 11.5795 11.6667 12.5 11.6667C13.4205 11.6667 14.1667 10.9205 14.1667 10ZM2.5 15.8333H5.83333M5.83333 15.8333C5.83333 16.7538 6.5795 17.5 7.5 17.5C8.4205 17.5 9.16667 16.7538 9.16667 15.8333C9.16667 14.9128 8.4205 14.1667 7.5 14.1667C6.5795 14.1667 5.83333 14.9128 5.83333 15.8333ZM12.5 15.8333H17.5"
              stroke="#21409A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button class="acl-filter-add-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 3.75V14.25M3.75 9H14.25" stroke="#21409A" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          Add filter
        </button>
      </div>
    </div>
  </div>

  <!-- Active Filter Chips -->
  <div class="acl-filter-chips" *ngIf="activeFilterChips.length">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path
        d="M8.37473 18C8.30134 18 8.2096 17.9817 8.1362 17.9633C7.87932 17.9083 7.64079 17.7431 7.4573 17.5229C7.4573 17.5046 7.43895 17.5046 7.43895 17.4862C7.23712 17.1927 7.23712 16.8991 7.23712 16.4954V10.9725C7.23712 10.8991 7.23712 10.8073 7.23712 10.7706L7.21877 10.7523C7.20042 10.7339 7.20042 10.7156 7.18207 10.6972C7.14538 10.6606 7.10868 10.6239 7.07198 10.5688L2.41143 5.3945L2.30134 5.2844C1.65914 4.55046 1.31051 4.14679 1.29217 3.61468C1.27382 3.11927 1.47565 2.66055 1.86097 2.34862C2.28299 2 2.83345 2 3.93437 2H16.0628C17.1637 2 17.7142 2 18.1546 2.34862C18.5399 2.66055 18.7417 3.13761 18.705 3.63303C18.6683 4.18349 18.283 4.6422 17.5857 5.3945L12.8885 10.6422C12.8701 10.6789 12.8518 10.6972 12.8334 10.7156V10.7339C12.8151 10.7523 12.8151 10.7706 12.7968 10.789C12.7968 10.8257 12.7968 10.9174 12.7968 10.9908V15.3578C12.7968 15.5596 12.7968 15.6881 12.7601 15.8532C12.7601 15.8716 12.7417 15.8899 12.7417 15.9083C12.6867 16.0734 12.5949 16.2202 12.4481 16.367C12.3197 16.4954 12.1729 16.5688 12.0812 16.6055C12.0628 16.6239 12.0261 16.6239 11.9894 16.6422C11.9711 16.6422 11.9527 16.6605 11.9344 16.6605L9.18207 17.7798C8.92519 17.8716 8.64996 18 8.37473 18ZM8.48483 10C8.59492 10.1651 8.64996 10.3303 8.66831 10.422C8.66831 10.4404 8.66831 10.4404 8.66831 10.4587C8.70501 10.6239 8.70501 10.7523 8.70501 10.9725V16.3853L11.3105 15.3394V10.9908C11.3105 10.789 11.3105 10.6422 11.3472 10.4771C11.3472 10.4587 11.3472 10.4587 11.3472 10.4404C11.3839 10.2936 11.439 10.1835 11.4757 10.0917C11.549 9.90826 11.6591 9.79816 11.7692 9.66972L11.8059 9.61468L16.4665 4.40367C16.6867 4.16514 17.127 3.68807 17.2188 3.50459C17.0353 3.46789 16.5399 3.46789 16.0445 3.46789H3.93437C3.43895 3.46789 2.94354 3.46789 2.76006 3.50459C2.83345 3.63303 3.12703 3.9633 3.40226 4.27523L3.51235 4.38532L8.19125 9.57798C8.2096 9.59633 8.22794 9.61468 8.22794 9.63303C8.26464 9.68807 8.30134 9.72477 8.31969 9.74312C8.37473 9.83486 8.42978 9.90826 8.48483 10Z"
        fill="#667085" />
    </svg>
    <span class="acl-filter-chip" *ngFor="let chip of activeFilterChips">
      {{ chip.label }}
      <button type="button" [attr.aria-label]="'Remove filter ' + chip.label" (click)="removeFilterChip(chip.key)">
        <svg xmlns="http://www.w3.org/2000/svg" width="7" height="7" viewBox="0 0 7 7" fill="none">
          <path d="M5.7998 0.799805L0.799805 5.7998M0.799805 0.799805L5.7998 5.7998" stroke="#4D555B" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </span>
  </div>

  <!-- Search -->
  <div class="acl-search-row">
    <div class="acl-filter-field">
      <label>Search</label>
      <div class="acl-search-input">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
          <path d="M15.75 15.75L12.49 12.49M14.25 8.25a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z" stroke="#667085"
            stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <input type="text" placeholder="Search" [(ngModel)]="searchTerm" />
      </div>
    </div>
  </div>

  <!-- Grid -->
  <div class="acl-grid-wrapper">
    <ag-grid-angular class="acl-grid" [theme]="gridTheme" [columnDefs]="columnDefs" [rowData]="pagedRows"
      [defaultColDef]="defaultColDef" [rowSelection]="rowSelection" [selectionColumnDef]="selectionColumnDef"
      [pagination]="false" [suppressPaginationPanel]="true"></ag-grid-angular>
    <div class="acl-pagination">
      <span class="acl-pagination__range">{{ paginationInfo }}</span>
      <div class="acl-pagination__controls">
        <button (click)="firstPage()" [disabled]="currentPage === 1" title="First page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="11 17 6 12 11 7"></polyline>
            <polyline points="18 17 13 12 18 7"></polyline>
          </svg>
        </button>
        <button (click)="prevPage()" [disabled]="currentPage === 1" title="Previous page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="acl-pagination__page">Page {{ currentPage }} of {{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="currentPage === totalPages" title="Next page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button (click)="lastPage()" [disabled]="currentPage === totalPages" title="Last page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 17 18 12 13 7"></polyline>
            <polyline points="6 17 11 12 6 7"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>
