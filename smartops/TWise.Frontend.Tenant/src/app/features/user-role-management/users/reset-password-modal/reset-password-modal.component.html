<div *ngIf="isOpen" class="dialog-backdrop" (click)="close()">
  <div appDialog (dialogClose)="close()" class="dialog reset-password-modal" (click)="$event.stopPropagation()">
    <div class="reset-password-modal__header">
      <span class="reset-password-modal__icon">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <div class="reset-password-modal__title">
        <h3>Password Reset</h3>
        <p>
          A new password has been generated for <strong>{{ userName || email }}</strong
          >.
        </p>
      </div>
      <button
        type="button"
        class="reset-password-modal__close"
        (click)="close()"
        aria-label="Close"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="reset-password-modal__body">
      <label class="reset-password-modal__label">Temporary password</label>
      <div class="reset-password-modal__field">
        <input type="text" class="reset-password-modal__input" [value]="password" readonly />
        <button
          type="button"
          class="reset-password-modal__copy"
          (click)="copyPassword()"
          [title]="copied ? 'Copied' : 'Copy to clipboard'"
        >
          <svg
            *ngIf="!copied"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg
            *ngIf="copied"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0B8F46"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>

      <div class="reset-password-modal__warning">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          ></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span
          >This password is shown only once. Copy it now and share it securely with the user.</span
        >
      </div>
    </div>

    <div class="reset-password-modal__footer">
      <button type="button" class="reset-password-modal__done" (click)="close()">Done</button>
    </div>
  </div>
</div>
