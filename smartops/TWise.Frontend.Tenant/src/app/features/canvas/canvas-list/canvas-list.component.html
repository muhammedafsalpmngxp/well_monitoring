<app-page-header [title]="mode === 'standard' ? 'Standard Canvases' : mode === 'wip' ? 'WIP Canvases' : 'Canvases'"
  [subtitle]="mode === 'standard' ? 'Published canvases, ready to view and share.' : 'Put charts, tiles and tables from your data models side by side, on as many sheets as you need.'"
  [breadcrumbs]="[{ label: 'Home' }, { label: 'BI Canvas' }, { label: mode === 'standard' ? 'Standard Canvases' : mode === 'wip' ? 'WIP Canvases' : 'Canvases' }]">
  <span page-header-icon class="canvas-list__icon"><app-icon name="dashboard" aria-hidden="true"></app-icon></span>
  <app-button *ngIf="canCreate && showWip" variant="primary" (clicked)="openCreate()">New Canvas</app-button>
</app-page-header>

<div *ngIf="toast" class="canvas-list__toast" [class.canvas-list__toast--error]="toast.kind === 'error'" role="status">
  {{ toast.text }}
</div>

<app-loader *ngIf="loading" size="lg"></app-loader>
<p *ngIf="!loading && error" class="canvas-list__error" role="alert">{{ error }}</p>

<app-empty-state *ngIf="!loading && !error && empty" appIcon="dashboard" [title]="mode === 'standard' ? 'No Published Canvases Yet' : 'No Canvases Yet'"
  [description]="mode === 'standard' ? 'Published Canvases appear here once their authors publish them.' : 'A Canvas shows charts, tiles and tables built on your data models, on one or more sheets.'">
  <app-button *ngIf="canCreate && showWip" variant="primary" (clicked)="openCreate()">New Canvas</app-button>
</app-empty-state>

<h2 *ngIf="!loading && !mode && canvases.length > 0 && published.length > 0" class="canvas-list__section-title">My canvases</h2>
<div *ngIf="!loading && showWip && canvases.length > 0" class="canvas-list__grid">
  <app-item-card *ngFor="let canvas of canvases" [title]="canvas.dashboardName" [description]="canvas.description ?? null"
    [status]="canvas.status" accent="orange" icon="dashboard" preview="assets/images/new-dashboard-img.svg"
    [category]="canvas.categoryName" [modified]="canvas.modifiedDate ? 'Changed ' + (canvas.modifiedDate | date: 'mediumDate') : null"
    [canPublish]="canModify" [publishing]="publishingId === canvas.dashboardId" [hasMenu]="canModify || canSchedule"
    (opened)="open(canvas)" (publish)="publish(canvas)">
    <button *ngIf="canModify" item-card-action type="button" (click)="open(canvas)">Edit</button>
    <button *ngIf="canModify" item-card-action type="button" (click)="publish(canvas)">Publish</button>
    <button *ngIf="canSchedule" item-card-action type="button" (click)="scheduleFor(canvas)">Schedule</button>
    <button *ngIf="canModify" item-card-action type="button" class="item-card-danger" (click)="pendingDelete = canvas">Delete</button>
  </app-item-card>
</div>

<section *ngIf="!loading && showStandard && published.length > 0" aria-labelledby="published-canvases-title">
  <h2 *ngIf="!mode" id="published-canvases-title" class="canvas-list__section-title">Published</h2>
  <div class="canvas-list__grid">
    <app-item-card *ngFor="let canvas of published" [title]="canvas.dashboardName" [description]="canvas.description ?? null"
      [status]="canvas.status" [published]="true" accent="green" icon="dashboard" preview="assets/images/new-dashboard-img.svg"
      [category]="canvas.categoryName" [modified]="canvas.modifiedDate ? 'Changed ' + (canvas.modifiedDate | date: 'mediumDate') : null"
      [hasMenu]="canSchedule" (opened)="open(canvas)">
      <button item-card-action type="button" (click)="scheduleFor(canvas)">Schedule</button>
    </app-item-card>
  </div>
</section>

<div *ngIf="createOpen" class="canvas-list__overlay" (click)="createOpen = false">
  <form appDialog (dialogClose)="createOpen = false" class="canvas-list__modal" role="dialog" aria-modal="true" aria-labelledby="new-canvas-title"
    (click)="$event.stopPropagation()" (ngSubmit)="create()">
    <h2 id="new-canvas-title" class="canvas-list__modal-title">New Canvas</h2>
    <div class="form-group">
      <label for="canvas-name">Name</label>
      <input id="canvas-name" class="form-control" name="name" maxlength="100" required [(ngModel)]="form.name" />
      <p class="form-hint">Letters, numbers, spaces, hyphens, underscores, brackets and &amp;.</p>
    </div>
    <div class="form-group">
      <label for="canvas-category">Category</label>
      <app-category-search #canvasCategorySearch [options]="categories" labelKey="categoryName"></app-category-search>
      <select id="canvas-category" class="form-control" name="categoryId" required [(ngModel)]="form.categoryId">
        <option [ngValue]="null" disabled>Choose a category</option>
        <option *ngFor="let category of categories" [ngValue]="category.categoryId" [hidden]="!canvasCategorySearch.matches(category)">{{ category.categoryName }}</option>
      </select>
    </div>
    <p *ngIf="formError" class="form-error" role="alert">{{ formError }}</p>
    <div class="canvas-list__modal-actions">
      <app-button variant="secondary" (clicked)="createOpen = false">Cancel</app-button>
      <app-button variant="primary" type="submit" [loading]="saving">Create</app-button>
    </div>
  </form>
</div>

<app-schedule-dialog *ngIf="scheduling" [target]="{ type: 'Canvas', id: scheduling.dashboardId, name: scheduling.dashboardName }"
  (closed)="scheduling = null"></app-schedule-dialog>

<app-confirmation-dialog [isOpen]="!!pendingDelete" title="Delete canvas" [message]="deleteMessage" confirmLabel="Delete"
  (confirmed)="confirmDelete()" (cancelled)="pendingDelete = null"></app-confirmation-dialog>
