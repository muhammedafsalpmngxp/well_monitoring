<router-outlet />
@if (routeLoading.isLoading()) {
	<app-loader [overlay]="true" size="lg" role="status" aria-live="polite" />
}
<app-confirmation-dialog
	[isOpen]="errorHandler.chunkLoadFailed()"
	title="Unable to load this feature"
	message="Part of the app could not be downloaded. Check your connection, then reload the page to try again."
	details="Reloading may discard unsaved changes. Choose Stay here to keep your current work."
	confirmLabel="Reload page"
	cancelLabel="Stay here"
	variant="warning"
	(confirmed)="errorHandler.reloadPage()"
	(cancelled)="errorHandler.dismissChunkLoadError()"
/>
