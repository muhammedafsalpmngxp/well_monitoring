<div class="forgot-password-page">
  <div class="forgot-card">
    <div class="forgot-header">
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a password reset link</p>
    </div>

    <ng-container *ngIf="!isSubmitted">
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
            class="form-control"
            [class.is-invalid]="email?.invalid && email?.touched"
          />
          <span *ngIf="email?.hasError('required') && email?.touched" class="form-error">
            Email is required.
          </span>
          <span *ngIf="email?.hasError('email') && email?.touched" class="form-error">
            Enter a valid email address.
          </span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-full" [disabled]="isLoading">
          {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    </ng-container>

    <div *ngIf="isSubmitted" class="success-message">
      <p>Password reset link has been sent to your email.</p>
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <button class="btn btn-link" (click)="backToLogin()">Back to Login</button>
    </div>
  </div>
</div>
