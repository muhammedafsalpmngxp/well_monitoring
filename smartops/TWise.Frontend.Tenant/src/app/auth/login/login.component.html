<h2 class="lg-welcome">Welcome Back</h2>
<p class="lg-welcome-sub">Sign in using your Al Tasnim corporate account.</p>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="lg-field">
    <label class="lg-label" for="lgEmail">Email</label>
    <div class="lg-input-wrap">
      <span class="lg-input-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg></span>
      <input class="lg-input" id="lgEmail" type="email" formControlName="email"
             autocomplete="username" placeholder="john@gmail.com"
             [class.is-invalid]="email?.invalid && email?.touched">
    </div>
    <span *ngIf="email?.hasError('required') && email?.touched" class="lg-field-error">Email is required.</span>
    <span *ngIf="email?.hasError('email') && email?.touched" class="lg-field-error">Enter a valid email address.</span>
  </div>

  <div class="lg-field">
    <label class="lg-label" for="lgPass">Password</label>
    <div class="lg-input-wrap">
      <span class="lg-input-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <input class="lg-input" id="lgPass" [type]="showPass ? 'text' : 'password'"
             formControlName="password" autocomplete="current-password"
             placeholder="Enter password"
             [class.is-invalid]="password?.invalid && password?.touched">
      <button type="button" class="lg-eye" (click)="toggleShow()"
              [attr.aria-label]="showPass ? 'Hide password' : 'Show password'">
        <svg *ngIf="!showPass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <svg *ngIf="showPass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <span *ngIf="password?.hasError('required') && password?.touched" class="lg-field-error">Password is required.</span>
  </div>

  <div class="lg-row">
    <label class="lg-keep">
      <input type="checkbox" formControlName="keepSignedIn">
      <span>Keep me signed in</span>
    </label>
    <a routerLink="../forgot-password" class="lg-forgot">Forgot Password ?</a>
  </div>

  <div *ngIf="errorMessage()" class="lg-error-msg">{{ errorMessage() }}</div>

  <button type="submit" class="lg-btn" [disabled]="isLoading() || isNavigating()">
    <span *ngIf="isLoading()" style="display:inline-flex;align-items:center;gap:8px;">
      <svg style="animation:spin 1s linear infinite;width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
      Signing in...
    </span>
    <span *ngIf="!isLoading()" style="display:inline-flex;align-items:center;gap:8px;">
      Sign in
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </span>
  </button>
</form>

<div class="lg-divider"><span>OR</span></div>

<button type="button" class="lg-btn-sso">
  <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="9" height="9" fill="#F25022"/>
    <rect x="11" y="1" width="9" height="9" fill="#7FBA00"/>
    <rect x="1" y="11" width="9" height="9" fill="#00A4EF"/>
    <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
  </svg>
  Continue with Microsoft SSO
</button>

<div class="lg-foot">
  By signing in you agree to Al Tasnim's <a href="#" (click)="$event.preventDefault()">acceptable use policy.</a><br>
  &copy; 2026 Al Tasnim Enterprises LLC.
</div>
