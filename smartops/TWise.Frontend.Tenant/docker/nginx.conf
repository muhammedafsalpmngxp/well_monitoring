# The controlplane_up / tenant_up upstreams are generated at container start by
# /docker-entrypoint.d/35-twise-upstreams.sh (conf.d/00-twise-upstreams.conf).
# They pin the Service Connect alias to its IPv4 address: the alias also has an
# IPv6 address in /etc/hosts that the task can't route to, which otherwise made
# nginx log "connect() ... Network unreachable" on every other request.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    # Dataset file uploads are capped at 10 MB by the API; allow the multipart overhead on top.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Runtime config: must NEVER be cached, it differs per environment.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Content-hashed build output (outputHashing: "all").
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ControlPlane and Tenant have no ALB listener — they are reachable only
    # inside the VPC over Service Connect, so the browser calls them
    # same-origin through here. Trailing slashes on both sides strip the
    # matched prefix: /api/controlplane/auth/login -> controlplane:8080/auth/login,
    # /api/tenant/wells -> tenant:8080/api/wells.
    #
    # ^~ on this and the /api/tenant/ block below: without it the regex
    # static-asset location above wins for any *.png/*.jpg/*.svg URL and
    # 404s against nginx's local filesystem instead of proxying (e.g. Tenant's
    # /api/tenant/dashboard/logos/<id>.png).
    location ^~ /api/controlplane/ {
        proxy_pass http://controlplane_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tenant's Swagger routes (/swagger/...) live outside its /api/* route
    # space, so they need their own block ahead of the general /api/tenant/
    # proxy below — otherwise that block's "re-add /api/" rewrite sends
    # requests to tenant:8080/api/swagger/... instead of tenant:8080/swagger/...
    #
    # ^~ is required: without it, nginx still checks the regex location above
    # for any *.css/*.js request (regex locations always win over a plain
    # prefix match, regardless of order/specificity) and 404s swagger-ui's
    # own assets against nginx's local filesystem instead of proxying them.
    location ^~ /api/tenant/swagger/ {
        proxy_pass http://tenant_up/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tenant's own routes are only reachable externally under
        # /api/tenant/* (see the block below) — Swashbuckle doesn't know
        # that, so without this its "Try it out" calls plain /api/*, which
        # falls through to the Angular SPA fallback instead of Tenant.
        proxy_set_header X-Forwarded-Prefix /api/tenant;
    }

    location ^~ /api/tenant/ {
        proxy_pass http://tenant_up/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PathLocationStrategy + lazy loadChildren routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
