apiVersion: v1
kind: ConfigMap
metadata:
  name: smartops-config
  namespace: smartops
data:
  Cors__AllowedOrigins: "http://localhost:4200,https://smartops.example.com"
  JwtSettings__Issuer: "smartops.auth"
  JwtSettings__Audience: "smartops.api"
  JwtSettings__ExpiryMinutes: "480"
  Redis__ConnectionString: "redis:6379"
  Logging__LogLevel__Default: "Information"
---
apiVersion: v1
kind: Secret
metadata:
  name: smartops-secrets
  namespace: smartops
type: Opaque
stringData:
  JwtSettings__SecretKey: "REPLACE-WITH-REAL-SECRET-32-BYTES-MIN"
  ConnectionStrings__Default: "Server=mssql,1433;Database=smartops;User=sa;Password=CHANGE_ME;TrustServerCertificate=True;"
  AzureAd__TenantId: ""
  AzureAd__ClientId: ""
  AzureAd__Audience: ""
  OPENAI_API_KEY: ""
  GROQ_API_KEY: ""
