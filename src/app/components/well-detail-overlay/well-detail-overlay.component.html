    <!-- Well Detail Overlay (managed by WellDetailOverlayComponent / WellDetailService) -->
    <div id="awDetailOverlay" [style.display]="isVisible ? 'block' : 'none'">
      <div id="awDetailInner" #detailInner></div>
    </div>

    <!-- AI Recovery Assistant Modal -->
    <div id="aiRecOverlay" class="ai-rec-overlay" onclick="if(event.target===this) aiRecoveryClose()">
      <div class="ai-rec-panel" role="dialog" aria-labelledby="aiRecTitle">
        <div class="ai-rec-head">
          <div class="ai-rec-head-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <div class="wd-flex-fill">
            <div class="ai-rec-head-title" id="aiRecTitle">AI Recovery Assistant</div>
            <div class="ai-rec-head-sub">Click a well to generate recovery plan</div>
          </div>
          <button type="button" class="ai-rec-close" onclick="aiRecoveryClose()" aria-label="Close">✕</button>
        </div>
        <div class="ai-rec-body" id="aiRecBody"></div>
      </div>
    </div>

    <!-- Well Report — full-page preview opened from the well detail header -->
    <div id="wrptOverlay" class="wrpt-overlay" onclick="if(event.target===this) wellReportClose()">
      <div class="wrpt-panel" role="dialog" aria-labelledby="wrptTitle">
        <div class="wrpt-head">
          <div class="wrpt-head-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div class="wd-flex-fill">
            <div class="wrpt-head-title" id="wrptTitle">Well Report</div>
            <div class="wrpt-head-sub" id="wrptSub">Comprehensive operational report</div>
          </div>
          <div class="wrpt-head-actions">
            <button type="button" class="wrpt-btn ghost" onclick="wellReportPrint()" title="Print report">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print
            </button>
            <button type="button" class="wrpt-btn ghost" onclick="wellReportEmailOpen()" title="Send report by email">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              Email
            </button>
            <button type="button" class="wrpt-btn primary" onclick="wellReportExport()" title="Export PDF">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export
            </button>
            <button type="button" class="wrpt-icon-btn" id="wrptExpandBtn" onclick="wellReportToggleFullscreen()" title="Expand to full screen" aria-label="Toggle full screen">
              <svg id="wrptExpandIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
            <button type="button" class="wrpt-close" onclick="wellReportClose()" aria-label="Close">✕</button>
          </div>

          <!-- Email composer (slides in over the report body) -->
          <div id="wrptEmailDialog" class="wrpt-email-dialog" role="dialog" aria-labelledby="wrptEmailTitle" aria-hidden="true" onclick="if(event.target===this) wellReportEmailClose()">
            <div class="wrpt-email-card">
              <div class="wrpt-email-head">
                <div class="wrpt-email-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div class="wd-flex-fill">
                  <div class="wrpt-email-title" id="wrptEmailTitle">Send Well Report</div>
                  <div class="wrpt-email-sub" id="wrptEmailSub">Recipients will receive the full report as a PDF attachment</div>
                </div>
                <button type="button" class="wrpt-email-close" onclick="wellReportEmailClose()" aria-label="Close">✕</button>
              </div>
              <div class="wrpt-email-body">
                <label class="wrpt-email-field">
                  <span class="wrpt-email-lbl">To</span>
                  <input type="text" id="wrptEmailTo" placeholder="name@example.com, name2@example.com" autocomplete="off">
                </label>
                <label class="wrpt-email-field">
                  <span class="wrpt-email-lbl">Cc</span>
                  <input type="text" id="wrptEmailCc" placeholder="optional" autocomplete="off">
                </label>
                <label class="wrpt-email-field">
                  <span class="wrpt-email-lbl">Subject</span>
                  <input type="text" id="wrptEmailSubject" autocomplete="off">
                </label>
                <label class="wrpt-email-field">
                  <span class="wrpt-email-lbl">Message</span>
                  <textarea id="wrptEmailBody" rows="6"></textarea>
                </label>
                <div class="wrpt-email-attach">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                  <span id="wrptEmailAttach">well-report.pdf</span>
                </div>
              </div>
              <div class="wrpt-email-foot">
                <button type="button" class="wrpt-btn ghost" onclick="wellReportEmailClose()">Cancel</button>
                <button type="button" class="wrpt-btn primary" onclick="wellReportEmailSend()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                  Send
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="wrpt-body" id="wrptBody"></div>
      </div>
    </div>
