<div id="page-mycharts" class="page active">
  <div class="breadcrumb">
    <a>My Charts</a>
  </div>
  <div class="page-title-row">
    <div class="mc-title-wrap">
      <div class="page-title">My Charts</div>
      <div class="page-subtitle">Charts you've created — pick a chart to open it</div>
    </div>
    <button class="fd-btn fd-btn-primary mc-new-btn" (click)="addChart()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Chart
    </button>
  </div>

  <div *ngIf="charts.length === 0" class="card mc-empty-card">
    <svg class="mc-empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <div class="mc-empty-title">No charts yet</div>
    <div class="mc-empty-sub">Charts you create with the chart builder will show up here.</div>
  </div>

  <div *ngIf="charts.length > 0" class="mc-grid">
    <div class="mc-card" *ngFor="let c of charts" (click)="open(c)">
      <div class="mc-card-thumb" [attr.data-viz]="c.icon">
        <svg *ngIf="c.icon === 'bar'" viewBox="0 0 60 40" fill="none">
          <rect x="6"  y="22" width="8" height="16" rx="1"/>
          <rect x="18" y="14" width="8" height="24" rx="1"/>
          <rect x="30" y="6"  width="8" height="32" rx="1"/>
          <rect x="42" y="18" width="8" height="20" rx="1"/>
        </svg>
        <svg *ngIf="c.icon === 'donut'" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="6">
          <circle cx="20" cy="20" r="14" opacity="0.18"/>
          <path d="M20 6 A14 14 0 0 1 32 26"/>
        </svg>
        <svg *ngIf="c.icon === 'line'" viewBox="0 0 60 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4,32 16,22 26,28 38,12 50,18 56,8"/>
        </svg>
      </div>
      <div class="mc-card-body">
        <div class="mc-card-name">{{ c.name }}</div>
        <div class="mc-card-desc">{{ c.description }}</div>
      </div>
    </div>
  </div>
</div>
