<div id="page-actmaster" class="page active">
        <!-- <div class="breadcrumb"><a>{{ 'ACTMASTER.BREADCRUMB_CREW_ACTIVITIES' | translate }}</a><span>›</span><span class="current">{{ 'ACTMASTER.BREADCRUMB_ACTIVITY_MASTER' | translate }}</span></div> -->
        <div class="page-title-row">
          <div class="am-title-flex">
            <div class="page-title">{{ 'ACTMASTER.TITLE' | translate }}</div>
            <div class="page-subtitle">{{ 'ACTMASTER.SUBTITLE' | translate }}</div>
          </div>
        </div>

        <!-- KPI strip -->
        <div class="am-strip" id="amStrip"></div>

        <!-- Tabs -->
        <div class="ai-tabs">
          <div class="ai-tab active" onclick="switchAmTab('activities',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            {{ 'ACTMASTER.TAB_ALL_ACTIVITIES' | translate }}
          </div>
          <div class="ai-tab" onclick="switchAmTab('mapping',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            {{ 'ACTMASTER.TAB_CREW_GROUP_MAPPING' | translate }}
          </div>
          <div class="ai-tab" onclick="switchAmTab('norms',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            {{ 'ACTMASTER.TAB_PRODUCTIVITY_NORMS' | translate }}
          </div>
        </div>

        <!-- Tab: All Activities -->
        <div id="amtab-activities" class="ai-tab-content active">
          <div class="am-toolbar">
            <div class="am-search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="amSearch" type="text" [placeholder]="'ACTMASTER.SEARCH_PLACEHOLDER' | translate"/>
            </div>
            <div class="cc-mono am-count" id="amCount">{{ 'ACTMASTER.ACTIVITIES_COUNT' | translate }}</div>
          </div>
          <div class="am-filter-row" id="amDiscFilters"></div>
          <div id="amActGrid" class="ag-theme-alpine-dark am-grid-wrap"></div>
        </div>

        <!-- Tab: Crew Group Mapping -->
        <div id="amtab-mapping" class="ai-tab-content">
          <div id="amMappingContent"></div>
        </div>

        <!-- Tab: Productivity Norms -->
        <div id="amtab-norms" class="ai-tab-content">
          <div id="amNormsContent"></div>
        </div>
      </div><!-- /page-actmaster -->
