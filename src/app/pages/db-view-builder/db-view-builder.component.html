<div id="page-db-view-builder" class="page active">
  <div class="dvb-app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">DV</div>
        <div>
          <div class="crumb">Settings · Database · Views</div>
          <h1>Database View Builder</h1>
        </div>
      </div>
      <div class="vname">
        <label for="dvb-vname">View name</label>
        <input id="dvb-vname" class="mono" spellcheck="false" value="well_activity_view">
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="dvb-backBtn">Cancel</button>
        <button class="btn ghost" id="dvb-resetBtn">Reset</button>
        <button class="btn primary" id="dvb-createBtn">Save view</button>
      </div>
    </header>

    <div class="workspace">
      <!-- Catalog -->
      <aside class="catalog">
        <div class="cat-head">
          <h2>Tables</h2>
          <div class="cat-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="dvb-catSearch" placeholder="Search tables & columns…" spellcheck="false">
          </div>
        </div>
        <div id="dvb-tableList"></div>
      </aside>

      <!-- Builder -->
      <main class="builder">
        <div class="section">
          <h3>Tables &amp; Joins <span class="sp"></span><span class="count" id="dvb-joinCount"></span></h3>
          <div class="body" id="dvb-joinArea"></div>
        </div>
        <div class="section">
          <h3>Columns <span class="count" id="dvb-colCount"></span><span class="sp"></span>
            <button class="btn tiny" id="dvb-allCols">Select all</button>
            <button class="btn tiny" id="dvb-noCols">Clear</button>
          </h3>
          <div class="body" id="dvb-colArea"></div>
        </div>
        <div class="section">
          <h3>Filters <span class="count">WHERE</span><span class="sp"></span>
            <button class="btn tiny" id="dvb-addFilter">+ Add condition</button>
          </h3>
          <div class="body" id="dvb-filterArea"></div>
        </div>
        <div class="section">
          <h3>Options</h3>
          <div class="body">
            <div class="opt-row">
              <label><input type="checkbox" id="dvb-distinct"> <span>Return distinct rows (<span class="mono">SELECT DISTINCT</span>)</span></label>
            </div>
          </div>
        </div>
      </main>

      <!-- SQL / Preview -->
      <aside class="sqlpanel">
        <div class="sqltabs">
          <div class="sqltab on" data-tab="sql">SQL</div>
          <div class="sqltab" data-tab="preview">Data preview</div>
        </div>
        <div class="sql-body" id="dvb-sqlBody">
          <div class="sql-tools">
            <div class="switch" id="dvb-editSwitch"><span>Edit SQL</span><span class="track"><span class="knob"></span></span></div>
            <span class="sp"></span>
            <button class="mini" id="dvb-regenBtn" title="Regenerate from builder">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg> Regenerate
            </button>
            <button class="mini" id="dvb-copyBtn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Copy
            </button>
          </div>
          <div class="manual-banner" id="dvb-manualBanner">Manual edits are active — builder changes are paused. Use “Regenerate” to rebuild from your selections.</div>
          <div class="sql-scroll" id="dvb-sqlScroll"><pre class="sql" id="dvb-sqlPre"></pre></div>
        </div>
        <div class="sql-body" id="dvb-previewBody" style="display:none;">
          <div class="pv-note" id="dvb-pvNote"></div>
          <div class="pv-wrap" id="dvb-pvWrap"></div>
        </div>
      </aside>
    </div>
    <div class="toast" id="dvb-toast"></div>
  </div>
</div>
