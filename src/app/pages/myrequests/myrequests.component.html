<div id="page-myrequests" class="page active">
  <div class="breadcrumb">
    <a>{{ 'SIDEBAR.CATALOGUE' | translate }}</a><span>›</span>
    <span class="current">{{ 'MY_REQUESTS.PAGE_TITLE' | translate }}</span>
  </div>

  <div class="card mr-card">
    <div class="card-head">
      <div class="mr-head-left">
        <div class="card-title">{{ 'MY_REQUESTS.PAGE_TITLE' | translate }}</div>
        <div class="card-sub">
          <span *ngIf="items.length === 0">{{ 'MY_REQUESTS.EMPTY_HINT' | translate }}</span>
          <span *ngIf="items.length > 0">{{ items.length | number }} request<span *ngIf="items.length !== 1">s</span> submitted</span>
        </div>
      </div>
      <button class="aw-btn export mr-new-btn" (click)="onNewRequest()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        {{ 'MY_REQUESTS.NEW_REQUEST' | translate }}
      </button>
    </div>

    <div *ngIf="items.length > 0" class="mr-table-wrap">
      <div id="mrRequestsGrid" class="ag-theme-alpine-dark"></div>
    </div>
  </div>
</div>
