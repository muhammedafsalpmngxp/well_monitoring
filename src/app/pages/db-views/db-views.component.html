<div id="page-db-views" class="page active">

  <div class="page-title-row">
    <div class="dbv-title-wrap">
      <div class="page-title">Database Views</div>
      <div class="page-subtitle">Reusable SQL views built over the data model — open one to inspect its data, source tables and query.</div>
    </div>
    <div class="dbv-actions">
      <button class="dbv-btn dbv-btn--primary" (click)="createView()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create view
      </button>
    </div>
  </div>

  <div class="dbv-grid-wrap">
    <div id="dbvGrid"></div>
  </div>
</div>
