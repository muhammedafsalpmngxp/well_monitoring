<div id="page-myboards" class="page active">
  <div class="breadcrumb">
    <a>My Boards</a>
  </div>
  <div class="page-title-row">
    <div class="mb-title-wrap">
      <div class="page-title">My Boards</div>
      <div class="page-subtitle">Your saved and pinned dashboards — pick a board to open it</div>
    </div>
    <button class="fd-btn fd-btn-primary mb-new-btn" onclick="dbOpenAddDashboard()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      {{ 'DASHBOARDS.ADD_DASHBOARD' | translate }}
    </button>
  </div>

  <div *ngIf="boards.length === 0" class="card mb-empty-card">
    <svg class="mb-empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
    <div class="mb-empty-title">No boards yet</div>
    <div class="mb-empty-sub">Boards you publish from BI Boards will show up here.</div>
  </div>

  <div *ngIf="boards.length > 0" class="mb-grid">
    <div class="mb-card" *ngFor="let b of boards" (click)="open(b)">
      <div class="mb-card-thumb" [attr.data-viz]="b.icon">
        <svg *ngIf="b.icon === 'donut'" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="6">
          <circle cx="20" cy="20" r="14" opacity="0.18"/>
          <path d="M20 6 A14 14 0 0 1 32 26"/>
        </svg>
        <svg *ngIf="b.icon === 'grid'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </div>
      <div class="mb-card-body">
        <div class="mb-card-name">{{ b.name }}</div>
        <div class="mb-card-desc">{{ b.description }}</div>
      </div>
    </div>
  </div>
</div>
